<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>" />
<title>WPMT Brand Vault</title>
<style>
  :root {
    --bg: #0d0f14;
    --panel: #161922;
    --panel-2: #1d2230;
    --panel-3: #252b3b;
    --border: #2c3245;
    --text: #ecedf3;
    --muted: #8b93a7;
    --accent: #f5a623;
    --accent-2: #ff6b6b;
    --accent-3: #b07cff;
    --danger: #ff6b8a;
    --success: #6bd98c;
    --warn: #ffb450;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
    font-size: 14px; line-height: 1.5;
  }

  /* === 로그인 === */
  .auth-overlay {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 9999;
  }
  .auth-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px; max-width: 400px; width: 100%;
  }
  .auth-card h2 {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin: 0 0 8px; font-size: 26px;
  }
  .auth-card p { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .auth-card input {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; color: var(--text);
    font-size: 15px; margin-bottom: 10px; font-family: inherit;
  }
  .auth-card input:focus { border-color: var(--accent); outline: none; }
  .auth-btn {
    width: 100%; background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #181014; border: 0; padding: 12px; border-radius: 10px;
    font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .auth-btn.google {
    background: #fff; color: #1f1f1f; margin-bottom: 12px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .auth-divider {
    display: flex; align-items: center; gap: 10px;
    color: var(--muted); font-size: 12px; margin: 12px 0;
  }
  .auth-divider::before, .auth-divider::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }
  .auth-msg { font-size: 13px; padding: 10px; border-radius: 8px; margin-top: 10px; display: none; }
  .auth-msg.err { background: rgba(255,107,138,.1); color: var(--danger); }
  .auth-msg.ok { background: rgba(107,217,140,.1); color: var(--success); }
  .auth-back { background: none; border: 0; color: var(--muted); font-size: 13px; cursor: pointer; padding: 8px; }

  /* === 헤더 === */
  header.topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 22px; border-bottom: 1px solid var(--border);
    background: var(--panel); position: sticky; top: 0; z-index: 50;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-size: 18px; font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .topbar-right { display: flex; align-items: center; gap: 14px; font-size: 13px; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
  .sync-dot.syncing { background: var(--warn); animation: pulse 1s infinite; }
  .sync-dot.error { background: var(--danger); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.3 } }

  .drive-status {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--border);
    cursor: pointer; user-select: none;
  }
  .drive-status:hover { background: var(--panel-3); }
  .drive-status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .drive-status.on .dot { background: var(--success); }

  .user-email { color: var(--muted); }
  .icon-btn {
    background: none; border: 1px solid var(--border); color: var(--text);
    padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .icon-btn:hover { background: var(--panel-2); }

  /* === 메인 === */
  .container { max-width: 1400px; margin: 0 auto; padding: 22px; }

  /* === 홈 대시보드 === */
  .dashboard {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 14px; margin-bottom: 24px;
  }
  @media (max-width: 1100px) { .dashboard { grid-template-columns: 1fr; } }
  .block {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px; min-height: 180px;
    display: flex; flex-direction: column;
  }
  .block h3 {
    margin: 0 0 10px; font-size: 14px; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  .block .hint { color: var(--muted); font-size: 12px; margin-bottom: 10px; }

  /* URL 입력 블록 */
  .url-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .url-row input {
    flex: 1; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; color: var(--text); font-size: 13px;
    font-family: inherit;
  }
  .url-row input:focus { border-color: var(--accent); outline: none; }
  .url-row select {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; color: var(--text); font-size: 13px;
    font-family: inherit; min-width: 130px;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #181014; border: 0; padding: 10px 18px;
    border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer;
    white-space: nowrap;
  }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .recent-list { font-size: 12px; color: var(--muted); }
  .recent-list .row { padding: 4px 0; display: flex; gap: 6px; align-items: center; }
  .recent-list .row .host { color: var(--accent); }
  .recent-list .row .ttl { color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 드롭존 */
  .drop {
    border: 2px dashed var(--border); border-radius: 12px;
    padding: 28px; text-align: center; cursor: pointer; flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--panel-2); transition: all 0.15s;
  }
  .drop:hover, .drop.over {
    border-color: var(--accent); background: rgba(245,166,35,0.05);
  }
  .drop .ico { font-size: 32px; margin-bottom: 8px; }
  .drop .label { font-size: 13px; font-weight: 600; }
  .drop .sublabel { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .upload-progress { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .upload-progress .item { padding: 4px 0; display: flex; gap: 6px; align-items: center; }

  /* 랜덤 뽑기 */
  .random-tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .random-tabs button {
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); padding: 5px 12px; border-radius: 8px;
    font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .random-tabs button.active {
    background: var(--accent); color: #181014; border-color: var(--accent);
    font-weight: 700;
  }
  .roll-btn {
    background: linear-gradient(135deg, var(--accent-3), var(--accent-2));
    color: #fff; border: 0; padding: 14px;
    border-radius: 10px; font-size: 16px; font-weight: 800; cursor: pointer;
    margin-bottom: 12px; letter-spacing: 0.02em;
  }
  .roll-btn:hover { filter: brightness(1.1); }
  .roll-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .random-result {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 12px;
    background: var(--panel-2); border-radius: 10px; min-height: 60px;
    overflow: hidden; position: relative;
  }
  .random-result img, .random-result video {
    max-width: 100%; max-height: 200px; border-radius: 8px; object-fit: contain;
  }
  .random-result .caption {
    position: absolute; bottom: 6px; left: 8px; right: 8px;
    font-size: 11px; color: var(--text); background: rgba(0,0,0,0.6);
    padding: 4px 8px; border-radius: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* 레퍼런스 한 줄 추가 폼 */
  .ref-add-row {
    display: flex; gap: 8px; align-items: center;
    padding: 8px 12px; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 14px;
  }
  .ref-add-row input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-size: 13px; font-family: inherit;
  }
  .ref-add-row select {
    background: var(--panel-3); border: 1px solid var(--border);
    color: var(--text); font-size: 12px; border-radius: 6px;
    padding: 4px 6px; font-family: inherit; cursor: pointer;
  }
  .ref-add-row .btn-primary {
    padding: 5px 14px; font-size: 12px; white-space: nowrap;
  }

  /* === 탭 (북마크 / 파일) === */
  .tabs {
    display: flex; gap: 4px; margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .tabs button {
    background: none; border: 0; color: var(--muted);
    padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
    border-bottom: 2px solid transparent; font-family: inherit;
  }
  .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs button:hover { color: var(--text); }

  /* === 카테고리 사이드 === */
  .cats-row {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px;
  }
  .cat-chip {
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); padding: 6px 14px; border-radius: 999px;
    font-size: 13px; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; gap: 6px;
  }
  .cat-chip:hover { background: var(--panel-3); }
  .cat-chip.active {
    background: var(--accent); color: #181014; border-color: var(--accent);
    font-weight: 700;
  }
  .cat-chip .n {
    background: rgba(0,0,0,0.2); padding: 2px 6px; border-radius: 8px;
    font-size: 11px; min-width: 18px; text-align: center;
  }
  .cat-chip.active .n { background: rgba(0,0,0,0.25); }

  /* === 카드 그리드 === */
  .grid {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px;
    display: flex; flex-direction: column; gap: 8px;
    transition: border-color 0.12s;
  }
  .card:hover { border-color: var(--accent); }
  .card .name {
    font-weight: 700; font-size: 14px; line-height: 1.3;
    word-break: break-word;
  }
  .card .handle { color: var(--accent); font-size: 12px; }
  .card .url {
    color: var(--muted); font-size: 11px; word-break: break-all;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card .cat-tag {
    display: inline-block; background: var(--panel-2); color: var(--accent);
    padding: 2px 8px; border-radius: 6px; font-size: 11px; align-self: flex-start;
  }
  .card .notes {
    background: var(--panel-2); border-radius: 8px; padding: 8px;
    font-size: 12px; color: var(--muted); min-height: 32px;
    border: 1px solid transparent; cursor: text;
    white-space: pre-wrap; word-break: break-word;
  }
  .card .notes:focus, .card .notes:hover { border-color: var(--border); color: var(--text); outline: none; }
  .card .notes:empty::before { content: '비고사항…'; color: var(--muted); opacity: 0.6; }
  .card .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .card .actions button, .card .actions a {
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); padding: 6px 10px; border-radius: 7px;
    font-size: 11px; cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; gap: 4px; font-family: inherit;
  }
  .card .actions button:hover, .card .actions a:hover { background: var(--panel-3); }
  .card .actions .del { color: var(--danger); }
  .card .actions .ig { color: #e1306c; border-color: rgba(225,48,108,0.3); }
  .card .actions .yt { color: #ff3b3b; border-color: rgba(255,59,59,0.3); }

  .empty {
    text-align: center; padding: 60px 20px;
    color: var(--muted); font-size: 14px;
  }

  /* === 파일 그리드 === */
  .file-grid {
    display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  }
  .file-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; cursor: pointer;
    aspect-ratio: 1; display: flex; flex-direction: column;
    position: relative; transition: border-color 0.12s;
  }
  .file-card:hover { border-color: var(--accent); }
  .file-card .thumb {
    flex: 1; background: var(--panel-2); display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }
  .file-card .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .file-card .thumb .ico { font-size: 36px; }
  .file-card .name {
    padding: 6px 8px; font-size: 11px; line-height: 1.3;
    background: rgba(0,0,0,0.6); position: absolute; bottom: 0; left: 0; right: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .file-card .badge {
    position: absolute; top: 6px; right: 6px;
    background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px;
    font-size: 10px;
  }
  .file-card .video-mark {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: rgba(0,0,0,0.5); border-radius: 50%; width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 18px;
  }

  /* === 모달 === */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: none; align-items: center; justify-content: center; z-index: 100;
    padding: 20px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 22px;
    max-width: 600px; width: 100%; max-height: 90vh; overflow: auto;
  }
  .modal.wide { max-width: 1100px; }
  .modal h3 { margin: 0 0 12px; font-size: 18px; }
  .modal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .modal .preview-media { width: 100%; max-height: 70vh; object-fit: contain; border-radius: 8px; }
  .btn { background: var(--accent); color: #181014; border: 0; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-weight: 700; font-family: inherit; }
  .btn.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); font-weight: 500; }
  .btn:hover { filter: brightness(1.1); }

  /* === Toast === */
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border);
    padding: 10px 18px; border-radius: 8px; font-size: 13px;
    z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }
  .toast.success { border-color: var(--success); color: var(--success); }
  .toast.error { border-color: var(--danger); color: var(--danger); }

  /* 핸들 입력창 */
  .input-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .input-row label { font-size: 12px; color: var(--muted); }
  .input-row input, .input-row textarea, .input-row select {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; color: var(--text);
    font-size: 13px; font-family: inherit;
  }
  .input-row textarea { min-height: 80px; resize: vertical; }

  /* ===== 팀 보드 공통 ===== */
  .section-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
  }
  .section-header h2 { margin: 0; font-size: 16px; font-weight: 700; }

  /* ===== 업무 보드 ===== */
  .task-board {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
  }
  @media (max-width: 900px) { .task-board { grid-template-columns: 1fr; } }
  .task-col {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px;
    min-height: 200px; display: flex; flex-direction: column; gap: 10px;
  }
  .task-col-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;
  }
  .task-col-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
  .member-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .task-card {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px;
    display: flex; flex-direction: column; gap: 6px;
    cursor: pointer; transition: border-color 0.12s; position: relative;
  }
  .task-card:hover { border-color: var(--accent); }
  .task-card .task-title { font-weight: 600; font-size: 13px; line-height: 1.4; word-break: break-word; }
  .task-card .task-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .task-card .task-due { font-size: 11px; color: var(--muted); }
  .task-card .task-note { font-size: 11px; color: var(--muted); white-space: pre-wrap; word-break: break-word; }
  .status-badge { font-size: 11px; padding: 2px 8px; border-radius: 6px; font-weight: 600; }
  .status-badge.todo { background: rgba(139,147,167,0.15); color: var(--muted); }
  .status-badge.doing { background: rgba(255,180,80,0.15); color: var(--warn); }
  .status-badge.done { background: rgba(107,217,140,0.15); color: var(--success); }
  .task-card .card-actions { position: absolute; top: 8px; right: 8px; display: none; gap: 4px; }
  .task-card:hover .card-actions { display: flex; }
  .add-task-btn {
    width: 100%; background: none; border: 1px dashed var(--border);
    color: var(--muted); padding: 10px; border-radius: 10px; cursor: pointer;
    font-size: 13px; font-family: inherit; transition: all 0.12s; margin-top: auto;
  }
  .add-task-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(245,166,35,0.05); }

  /* ===== 콘텐츠 스케줄 ===== */
  .schedule-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .schedule-nav .week-label { font-weight: 700; font-size: 15px; flex: 1; text-align: center; }
  .nav-btn {
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
    font-family: inherit;
  }
  .nav-btn:hover { background: var(--panel-3); }
  .schedule-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px;
  }
  @media (max-width: 1100px) { .schedule-grid { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 600px) { .schedule-grid { grid-template-columns: repeat(2, 1fr); } }
  .day-col {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px;
    min-height: 120px; display: flex; flex-direction: column; gap: 8px;
  }
  .day-col.today { border-color: var(--accent); }
  .day-header { display: flex; flex-direction: column; gap: 2px; margin-bottom: 4px; }
  .day-name { font-size: 11px; color: var(--muted); font-weight: 600; }
  .day-date { font-size: 14px; font-weight: 700; }
  .day-col.today .day-date { color: var(--accent); }
  .content-card {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px; font-size: 12px;
    cursor: pointer; transition: border-color 0.1s; display: flex; flex-direction: column; gap: 4px;
  }
  .content-card:hover { border-color: var(--accent); }
  .c-format { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; align-self: flex-start; }
  .c-format.reels { background: rgba(255,107,107,0.2); color: var(--accent-2); }
  .c-format.feed { background: rgba(245,166,35,0.2); color: var(--accent); }
  .c-format.story { background: rgba(176,124,255,0.2); color: var(--accent-3); }
  .content-card .c-topic { font-weight: 600; line-height: 1.3; word-break: break-word; }
  .content-card .c-bottom { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
  .content-card .c-assignee { font-size: 10px; }
  .c-status { font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 600; }

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function normalizeUrl(url) {
  if (!url) return '';
  url = String(url).trim();
  if (!url) return '';
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  return url;
}

function hostOf(url) {
  try { return new URL(url).hostname.toLowerCase().replace(/^www\./, ''); }
  catch { return 'unknown'; }
}

function extractHandle(url) {
  try {
    const u = new URL(url);
    const host = u.hostname.toLowerCase().replace(/^www\./, '');
    const path = u.pathname || '/';
    const SKIP = new Set(['p','reel','reels','stories','explore','tv','accounts','watch','channel','c','user','shorts','playlist','results','feed','home']);
    // /@user, /user, /@user/...
    const m = path.match(/^\/@?([A-Za-z0-9_.\-]+)/);
    if (m && !SKIP.has(m[1].toLowerCase())) {
      return '@' + m[1];
    }
    return null;
  } catch { return null; }
}

function decodeHtmlEntities(s) {
  const t = document.createElement('textarea');
  t.innerHTML = String(s ?? '');
  return t.value;
}

function getOembedUrl(url) {
  try {
    const u = new URL(url);
    const host = u.hostname.toLowerCase().replace(/^www\./, '');
    const path = u.pathname || '/';
    const isYt =
      (/(^|\.)youtube\.com$/.test(host) && (u.searchParams.has('v') || /^\/(shorts|embed|live)\//.test(path))) ||
      /^youtu\.be$/.test(host);
    if (isYt) return `https://www.youtube.com/oembed?url=${encodeURIComponent(url)}&format=json`;
    if (/tiktok\./.test(host) && /\/video\/\d+/.test(path)) {
      return `https://www.tiktok.com/oembed?url=${encodeURIComponent(url)}`;
    }
    return null;
  } catch { return null; }
}

async function fetchTitleViaOembed(url) {
  const o = getOembedUrl(url);
  if (!o) return null;
  try {
    const r = await fetch(o);
    if (!r.ok) return null;
    const data = await r.json();
    return decodeHtmlEntities((data.title || '').trim()) || null;
  } catch { return null; }
}

function isInstagramOrThreads(url) {
  const h = hostOf(url);
  return /instagram\./.test(h) || /threads\./.test(h);
}
function isYoutube(url) {
  const h = hostOf(url);
  return /youtube\./.test(h) || /youtu\.be$/.test(h);
}

function setSync(state) {
  const dot = $('#syncDot');
  dot.classList.remove('syncing','error');
  if (state === 'syncing') dot.classList.add('syncing');
  else if (state === 'error') dot.classList.add('error');

  scheduleSave() {
    if (!currentUser) return;
    clearTimeout(this._saveTimer);
    this._saveTimer = setTimeout(() => this.push(), 400);
  },
  async push() {
    if (!currentUser) return;
    setSync('syncing');
    const { error } = await supabase.from('wpmt_brand_vault').upsert({
      user_id: currentUser.id,
      bookmarks: bookmarks,
      drive_folder_id: driveFolderId,
      updated_at: new Date().toISOString(),
    }, { onConflict: 'user_id' });
    if (error) { console.error('save error:', error); setSync('error'); }
    else setSync('synced');
  },
  async pull() {
    if (!currentUser) return false;
    setSync('syncing');
    const { data, error } = await supabase
      .from('wpmt_brand_vault').select('*')
      .eq('user_id', currentUser.id).maybeSingle();

      driveFolderId = data.drive_folder_id || null;
      setSync('synced');
      return true;
    }
    setSync('synced');
    return false;
  },
};

function initDriveClient() {
  const cid = getSavedClientId();
  if (!cid || !window.google || !google.accounts || !google.accounts.oauth2) return;
  driveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: cid,
    scope: DRIVE_SCOPE,
    callback: (resp) => {
      if (resp.error) {
        console.warn('Drive auth error:', resp);
        if (resp.error !== 'popup_closed' && resp.error !== 'access_denied') {
          toast('Drive 인증 실패: ' + resp.error, 'error');
        }
        return;
      }
      driveAccessToken = resp.access_token;
      driveTokenExpiresAt = Date.now() + (resp.expires_in - 60) * 1000;
      onDriveConnected();
    },
  });
}

function isDriveConnected() {
  return driveAccessToken && Date.now() < driveTokenExpiresAt;
}

function requestDriveToken(silent) {
  if (!driveTokenClient) {
    if (silent) return;
    promptForClientId();
    return;
  }
  driveTokenClient.requestAccessToken({ prompt: silent ? '' : 'consent' });
}

async function ensureDriveToken() {
  if (isDriveConnected()) return true;
  if (!driveTokenClient) {
    promptForClientId();
    return false;
  }
  return new Promise((resolve) => {
    const orig = driveTokenClient.callback;
    driveTokenClient.callback = (resp) => {
      orig(resp);
      resolve(!!resp.access_token);
    };
    driveTokenClient.requestAccessToken({ prompt: '' });
  });
}

async function driveFetch(url, opts = {}) {
  if (!await ensureDriveToken()) throw new Error('not authenticated');
  const headers = { Authorization: 'Bearer ' + driveAccessToken, ...(opts.headers || {}) };
  const r = await fetch(url, { ...opts, headers });
  if (r.status === 401) {
    driveAccessToken = null;
    if (!await ensureDriveToken()) throw new Error('reauth failed');
    return fetch(url, { ...opts, headers: { Authorization: 'Bearer ' + driveAccessToken, ...(opts.headers || {}) } });
  }
  return r;
}

async function ensureDriveFolder() {
  if (driveFolderId) {
    // 검증 — 폴더가 휴지통에 있거나 사라졌는지
    try {
      const r = await driveFetch(`https://www.googleapis.com/drive/v3/files/${driveFolderId}?fields=id,trashed`);
      if (r.ok) {
        const j = await r.json();
        if (!j.trashed) return driveFolderId;
      }
    } catch {}
    driveFolderId = null;
  }
  // 검색
  const q = encodeURIComponent(`name='${DRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const r = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
  const j = await r.json();
  if (j.files && j.files.length > 0) {
    driveFolderId = j.files[0].id;
  } else {
    // 생성
    const cr = await driveFetch('https://www.googleapis.com/drive/v3/files', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' })
    });
    const cj = await cr.json();
    driveFolderId = cj.id;
  }
  Storage.scheduleSave();
  return driveFolderId;
}

async function uploadFileToDrive(file, onProgress) {
  await ensureDriveToken();
  const folderId = await ensureDriveFolder();
  const meta = { name: file.name, parents: [folderId] };
  const boundary = '-------wpmt' + Math.random().toString(36).slice(2);
  const delim = `\r\n--${boundary}\r\n`;
  const closeDelim = `\r\n--${boundary}--`;

  const head = delim
    + 'Content-Type: application/json; charset=UTF-8\r\n\r\n'
    + JSON.stringify(meta)
    + delim
    + `Content-Type: ${file.type || 'application/octet-stream'}\r\n\r\n`;
  // 더 간단/빠르게: resumable upload 대신 multipart 직접
  // 큰 파일은 resumable 권장이지만 여기선 multipart로 충분
  const bodyParts = [head, file, closeDelim];
  const body = new Blob(bodyParts);

  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,mimeType,thumbnailLink,webViewLink,createdTime');
    xhr.setRequestHeader('Authorization', 'Bearer ' + driveAccessToken);
    xhr.setRequestHeader('Content-Type', `multipart/related; boundary=${boundary}`);
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total);
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) resolve(JSON.parse(xhr.responseText));
      else reject(new Error('upload failed: ' + xhr.status + ' ' + xhr.responseText));
    };
    xhr.onerror = () => reject(new Error('upload network error'));
    xhr.send(body);
  });
}

async function listDriveFiles() {
  const folderId = await ensureDriveFolder();
  const fields = 'files(id,name,mimeType,thumbnailLink,webViewLink,webContentLink,createdTime,size)';
  const q = encodeURIComponent(`'${folderId}' in parents and trashed=false`);
  let all = [];
  let pageToken = null;
  do {
    const url = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=${encodeURIComponent(fields + ',nextPageToken')}&pageSize=200&orderBy=createdTime desc${pageToken ? `&pageToken=${pageToken}` : ''}`;
    const r = await driveFetch(url);
    const j = await r.json();
    if (j.files) all.push(...j.files);
    pageToken = j.nextPageToken;
  } while (pageToken);
  driveFiles = all;
  return all;
}

async function deleteDriveFile(fileId) {
  await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}`, { method: 'DELETE' });
  driveFiles = driveFiles.filter(f => f.id !== fileId);
}

// 인증된 미디어 가져오기 (썸네일/미리보기)
async function fetchDriveMediaUrl(fileId) {
  const r = await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
  if (!r.ok) return null;
  const blob = await r.blob();
  return URL.createObjectURL(blob);
}

async function handleFiles(files) {
  if (!files || files.length === 0) return;
  const accepted = files.filter(f => /^image\//.test(f.type) || /^video\//.test(f.type));
  if (accepted.length === 0) { toast('이미지 또는 영상만 업로드 가능해요', 'error'); return; }

  if (!isDriveConnected()) {
    if (!getSavedClientId()) promptForClientId();
    else requestDriveToken(false);
    toast('Drive 연결 후 다시 시도해주세요', 'error');
    return;
  }

  const progEl = $('#uploadProgress');
  progEl.innerHTML = '';
  for (const file of accepted) {
    const row = document.createElement('div');
    row.className = 'item';
    row.innerHTML = `<span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(file.name)}</span><span class="pct">0%</span>`;
    progEl.appendChild(row);
    try {
      const result = await uploadFileToDrive(file, (p) => {
        row.querySelector('.pct').textContent = Math.round(p * 100) + '%';
      });
      row.querySelector('.pct').textContent = '✓';
      // 즉시 캐시에 추가
      driveFiles.unshift({
        id: result.id,
        name: result.name,
        mimeType: result.mimeType,
        thumbnailLink: result.thumbnailLink,
        webViewLink: result.webViewLink,
        createdTime: result.createdTime,
      });
    } catch (e) {
      console.error(e);
      row.querySelector('.pct').textContent = '✗';
      row.style.color = 'var(--danger)';
    }
  }
  toast(`${accepted.length}개 업로드 완료`, 'success');
  setTimeout(() => { progEl.innerHTML = ''; }, 3500);
  renderFileGrid();
  updateFileCounts();
  fileInput.value = '';
}

    grid.innerHTML = `<div class="empty">📭 아직 북마크가 없어요</div>`;
    return;
  }
  grid.innerHTML = list.map(renderCard).join('');
  grid.querySelectorAll('.card').forEach(card => bindCardEvents(card));
}

function renderCard(b) {
  const igYt = isInstagramOrThreads(b.url) ? 'ig' : isYoutube(b.url) ? 'yt' : null;
  return `
    <div class="card" data-id="${b.id}">
      <span class="cat-tag">${escapeHtml(b.category)}</span>
      <div class="name" data-field="name" contenteditable="true" spellcheck="false">${escapeHtml(b.name)}</div>
      ${b.handle ? `<div class="handle">${escapeHtml(b.handle)}</div>` : ''}
      <div class="url" title="${escapeHtml(b.url)}">${escapeHtml(b.url)}</div>
      <div class="notes" data-field="notes" contenteditable="true" spellcheck="false">${escapeHtml(b.notes || '')}</div>
      <div class="actions">
        <a href="${escapeHtml(b.url)}" target="_blank" rel="noopener">↗ 열기</a>
        ${igYt === 'ig' ? `<button class="ig" data-act="ig">🎞 IG 다운로드</button>` : ''}
        ${igYt === 'yt' ? `<button class="yt" data-act="yt">🎬 YT 다운로드</button>` : ''}
        <select data-act="movecat" title="카테고리 변경">
          ${CATEGORIES.map(c => `<option value="${escapeHtml(c)}" ${c === b.category ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')}
        </select>
        <button class="del" data-act="del" title="삭제">🗑</button>
      </div>
    </div>
  `;
}

function bindCardEvents(card) {
  const id = card.dataset.id;
  card.querySelectorAll('[contenteditable]').forEach(el => {
    el.addEventListener('blur', () => {
      const it = bookmarks.find(b => b.id === id);
      if (!it) return;
      const field = el.dataset.field;
      const val = el.textContent.trim();
      if (it[field] !== val) {
        it[field] = val;
        Storage.scheduleSave();
      }
    });
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey && el.dataset.field === 'name') {
        e.preventDefault(); el.blur();
      }
    });
  });
  card.querySelector('[data-act="del"]')?.addEventListener('click', () => {
    if (!confirm('삭제할까요?')) return;
    bookmarks = bookmarks.filter(b => b.id !== id);
    Storage.scheduleSave();
    renderAll();
  });
  card.querySelector('[data-act="movecat"]')?.addEventListener('change', (e) => {
    const it = bookmarks.find(b => b.id === id);
    if (!it) return;
    it.category = e.target.value;
    Storage.scheduleSave();
    renderAll();
  });
  card.querySelector('[data-act="ig"]')?.addEventListener('click', () => {
    const it = bookmarks.find(b => b.id === id);
    if (it) openIgDownloader(it.url);
  });
  card.querySelector('[data-act="yt"]')?.addEventListener('click', () => {
    const it = bookmarks.find(b => b.id === id);
    if (it) openYtDownloader(it.url);
  });
}

/* ============================================================
 * 렌더 — 파일 그리드
 * ============================================================ */
function updateFileCounts() {
  const all = driveFiles.length;
  const img = driveFiles.filter(f => /^image\//.test(f.mimeType)).length;
  const vid = driveFiles.filter(f => /^video\//.test(f.mimeType)).length;
  $('#fct-all').textContent = all;
  $('#fct-image').textContent = img;
  $('#fct-video').textContent = vid;
  const fc = $('#fileCount'); if (fc) fc.textContent = `(${all})`;
}

function renderFileGrid() {
  const grid = $('#fileGrid');
  let list = driveFiles.slice();
  if (activeFileFilter === 'image') list = list.filter(f => /^image\//.test(f.mimeType));
  else if (activeFileFilter === 'video') list = list.filter(f => /^video\//.test(f.mimeType));
  if (list.length === 0) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">📭 ${isDriveConnected() ? '파일 없음' : 'Drive 먼저 연결'}</div>`;
    return;
  }
  grid.innerHTML = list.map(renderFileCard).join('');
  grid.querySelectorAll('.file-card').forEach(card => {
    const id = card.dataset.id;
    const f = driveFiles.find(x => x.id === id);
    if (!f) return;
    card.addEventListener('click', () => openFilePreview(f));
  });
  // 썸네일 인증 토큰으로 로딩
  list.forEach(f => {
    if (!f.thumbnailLink) return;
    const img = grid.querySelector(`.file-card[data-id="${f.id}"] .thumb img`);
    if (!img) return;
    fetch(f.thumbnailLink, { headers: { Authorization: 'Bearer ' + driveAccessToken } })
      .then(r => r.ok ? r.blob() : null)
      .then(blob => { if (blob) img.src = URL.createObjectURL(blob); })
      .catch(() => {});
  });
}

function renderFileCard(f) {
  const isImg = /^image\//.test(f.mimeType);
  const isVid = /^video\//.test(f.mimeType);
  const ico = isImg ? '🖼' : isVid ? '🎬' : '📄';
  return `
    <div class="file-card" data-id="${f.id}">
      <div class="thumb">
        ${f.thumbnailLink ? '<img alt="" />' : `<div class="ico">${ico}</div>`}
        ${isVid ? '<div class="video-mark">▶</div>' : ''}
      </div>
      <div class="badge">${isImg ? 'IMG' : isVid ? 'VID' : 'FILE'}</div>
      <div class="name" title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</div>
    </div>
  `;
}

async function openFilePreview(f) {
  openWideModal(`
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <div style="font-weight:700; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(f.name)}</div>
      <div style="display:flex; gap:6px;">

        <button class="btn ghost" id="dlBtn">⬇ 다운로드</button>
        <button class="btn ghost" id="delBtn" style="color:var(--danger)">🗑 삭제</button>
        <button class="btn ghost" data-close>닫기 ×</button>
      </div>
    </div>
    <div id="previewSlot" style="text-align:center; min-height:200px;">불러오는 중…</div>
  `);
  $('[data-close]').addEventListener('click', closeModal);
  $('#delBtn').addEventListener('click', async () => {
    if (!confirm('Drive에서 삭제할까요? (휴지통으로 이동)')) return;
    try {
      await deleteDriveFile(f.id);
      toast('삭제됨', 'success');
      closeModal();
      renderFileGrid();
      updateFileCounts();
    } catch (e) {
      toast('삭제 실패', 'error');
    }
  });
  $('#dlBtn').addEventListener('click', async () => {
    const url = await fetchDriveMediaUrl(f.id);
    if (!url) { toast('다운로드 실패', 'error'); return; }
    const a = document.createElement('a');
    a.href = url; a.download = f.name; a.click();
  });

  try {
    const url = await fetchDriveMediaUrl(f.id);
    if (!url) throw new Error('media fetch failed');
    const slot = $('#previewSlot');
    if (!slot) return;
    if (/^image\//.test(f.mimeType)) {
      slot.innerHTML = `<img class="preview-media" src="${url}" />`;
    } else if (/^video\//.test(f.mimeType)) {
      slot.innerHTML = `<video class="preview-media" src="${url}" controls autoplay></video>`;
    } else {
      slot.innerHTML = `<div>이 파일 형식은 미리보기 미지원 — Drive에서 열어보세요</div>`;
    }
  } catch (e) {
    const slot = $('#previewSlot');
    if (slot) slot.textContent = '미리보기 로딩 실패';
  }
}

async function checkServerRunning(baseUrl) {
  try {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 1500);
    await fetch(baseUrl + '/api/ping', { mode: 'no-cors', signal: ctrl.signal })
      .catch(async () => {
        await fetch(baseUrl + '/api/auth/status', { mode: 'no-cors', signal: ctrl.signal });
      });
    clearTimeout(to);
    return true;
  } catch { return false; }
}

function extractIgUsername(url) {
  try {
    const u = new URL(url);
    const m = u.pathname.match(/^\/@?([A-Za-z0-9_.]+)/);
    if (!m) return null;
    const f = m[1];
    if (['p','reel','reels','stories','explore','tv','accounts'].includes(f)) return null;
    return f;
  } catch { return null; }
}

async function loadTeamBoard() {
  const { data, error } = await supabase
    .from('wpmt_team_board')
    .select('id, type, data, created_at')
    .order('created_at', { ascending: true });
  if (error) {
    console.error('team board load error', error);
    const banner = $('#teamDbBanner');
    if (banner) banner.style.display = 'block';
    return;
  }
  const banner = $('#teamDbBanner');
  if (banner) banner.style.display = 'none';
  teamItems = data || [];
}

async function addTeamItem(type, itemData) {
  const { data, error } = await supabase
    .from('wpmt_team_board')
    .insert({ type, data: itemData, created_by: currentUser.id })
    .select().single();
  if (error) { toast('오류: ' + error.message, 'error'); return null; }
  teamItems.push(data);
  return data;
}

async function updateTeamItem(id, itemData) {
  const { error } = await supabase
    .from('wpmt_team_board')
    .update({ data: itemData, updated_at: new Date().toISOString() })
    .eq('id', id);
  if (error) { toast('오류: ' + error.message, 'error'); return false; }
  const idx = teamItems.findIndex(x => x.id === id);
  if (idx >= 0) teamItems[idx].data = itemData;
  return true;
}

async function deleteTeamItem(id) {
  const { error } = await supabase.from('wpmt_team_board').delete().eq('id', id);
  if (error) { toast('오류: ' + error.message, 'error'); return false; }
  teamItems = teamItems.filter(x => x.id !== id);
  return true;
}

function renderTasks() {
  const board = $('#taskBoard');
  if (!board) return;
  const tasks = teamItems.filter(x => x.type === 'task');
  board.innerHTML = MEMBERS.map((m, mi) => {
    const myTasks = tasks.filter(t => t.data.assignee === m.name);
    const cardsHtml = myTasks.map(t => {
      const d = t.data;
      return `
        <div class="task-card" data-id="${t.id}">
          <div class="task-title">${escapeHtml(d.title)}</div>
          <div class="task-meta">
            <span class="status-badge ${d.status}">${STATUS_LABEL[d.status] || d.status}</span>

          </div>
          ${d.note ? `<div class="task-note">${escapeHtml(d.note)}</div>` : ''}
          <div class="card-actions">

function wireTaskEvents() {
  $$('[data-act="add-task"]').forEach(btn =>

function getWeekDates(offset) {
  const today = new Date();
  const dow = today.getDay();
  const monday = new Date(today);
  monday.setDate(today.getDate() - (dow === 0 ? 6 : dow - 1) + offset * 14);
  return Array.from({ length: 14 }, (_, i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    return d;
  });
}

function fmtDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

const CAT_FORMAT_CLASS = { '콘텐츠': FORMAT_CLASS, '운영': {}, '굿즈': {} };
const CAT_COLORS = { '콘텐츠': 'accent-2', '운영': 'ops', '굿즈': 'goods' };

function scheduleCardHtml(item) {
  const cd = item.data;
  const isContent = !cd.category || cd.category === '콘텐츠';
  const isOps   = cd.category === '운영';
  const isGoods = cd.category === '굿즈';
  const mi = MEMBERS.findIndex(m => m.name === cd.assignee);
  let fmtLabel, fmtCls;
  if (isContent) { fmtLabel = cd.format || '콘텐츠'; fmtCls = FORMAT_CLASS[cd.format] || 'feed'; }
  else if (isOps) { fmtLabel = '운영'; fmtCls = 'ops'; }
  else { fmtLabel = '굿즈'; fmtCls = 'goods'; }
  const statusKey = cd.status || 'planning';
  return `
    <div class="content-card" data-id="${item.id}">
      <span class="c-format ${fmtCls}">${escapeHtml(fmtLabel)}</span>
      <div class="c-topic">${escapeHtml(cd.topic)}</div>
      <div class="c-bottom">
        <span class="c-assignee ${mi>=0?'m-'+mi:''}">${escapeHtml(mi>=0?MEMBERS[mi].nick:(cd.assignee||''))}</span>
        <span class="c-status ${statusKey}">${CONTENT_STATUS_LABEL[statusKey]||statusKey}</span>
      </div>
    </div>`;
}

function taskScheduleCardHtml(item) {
  const td = item.data;
  const mi = MEMBERS.findIndex(m => m.name === td.assignee);
  const st = td.status || 'todo';
  return `
    <div class="content-card" data-taskid="${item.id}" style="border-left:3px solid ${['#f5a623','#ff6b6b','#b07cff'][mi]||'#8b93a7'}">
      <span class="c-format task">✅ 업무</span>
      <div class="c-topic">${escapeHtml(td.title)}</div>
      <div class="c-bottom">
        <span class="c-assignee ${mi>=0?'m-'+mi:''}">${escapeHtml(mi>=0?MEMBERS[mi].nick:(td.assignee||''))}</span>
        <span class="c-status ${st}">${STATUS_LABEL[st]||st}</span>
      </div>
    </div>`;
}

function renderContentSchedule() {
  const grid = $('#scheduleGrid');
  const weekLabel = $('#weekLabel');
  if (!grid || !weekLabel) return;
  const dates = getWeekDates(scheduleWeekOffset);
  const todayStr = fmtDate(new Date());
  const first = dates[0], last = dates[13];
  weekLabel.textContent = `${first.getMonth()+1}월 ${first.getDate()}일 ~ ${last.getMonth()+1}월 ${last.getDate()}일`;
  const contents = teamItems.filter(x => x.type === 'content');
  const tasks = teamItems.filter(x => x.type === 'task' && x.data.due);
  grid.innerHTML = dates.map((d, di) => {
    const dateStr = fmtDate(d);
    const dayContents = contents.filter(c => c.data.date === dateStr);
    const dayTasks   = tasks.filter(t => t.data.due === dateStr);
    const cards = [
      ...dayContents.map(c => scheduleCardHtml(c)),
      ...dayTasks.map(t => taskScheduleCardHtml(t))
    ].join('');
    return `
      <div class="day-col ${dateStr===todayStr?'today':''}">
        <div class="day-header">
          <div class="day-name">${DAY_NAMES[di % 7]}</div>
          <div class="day-date">${d.getDate()}</div>
        </div>
        ${cards}
        <button class="add-day-btn" data-act="add-content" data-date="${dateStr}" title="추가">+</button>
      </div>`;
  }).join('');
  wireScheduleEvents();
}

function wireScheduleEvents() {
  $$('[data-act="add-content"]').forEach(btn =>
    btn.addEventListener('click', () => openContentModal(null, btn.dataset.date))
  );
  $$('.content-card[data-id]').forEach(card =>
    card.addEventListener('click', () => {
      const item = teamItems.find(x => x.id === card.dataset.id);
      if (item) openContentModal(item);
    })
  );
  $$('.content-card[data-taskid]').forEach(card =>
    card.addEventListener('click', () => {
      const item = teamItems.find(x => x.id === card.dataset.taskid);
      if (item) openTaskModal(item);
    })
  );
}

function openContentModal(item, defaultDate) {
  const d = item ? item.data : {};
  const isEdit = !!item;
  const initCat = d.category || '콘텐츠';
  openModal(`
    <h3>${isEdit ? '✏️ 일정 수정' : '📅 일정 추가'}</h3>
    <div class="input-row">
      <label>날짜</label>
      <input type="date" id="c-date" value="${d.date || defaultDate || fmtDate(new Date())}" />
    </div>
    <div class="input-row">
      <label>대주제</label>
      <div class="cat-tabs">
        <button class="cat-tab cont ${initCat==='콘텐츠'?'active':''}" data-cat="콘텐츠">콘텐츠</button>
        <button class="cat-tab ops  ${initCat==='운영'?'active':''}"  data-cat="운영">운영</button>
        <button class="cat-tab goods ${initCat==='굿즈'?'active':''}" data-cat="굿즈">굿즈</button>
      </div>
    </div>
    <div id="c-cont-fields" style="${initCat!=='콘텐츠'?'display:none':''}">
      <div class="input-row">
        <label>형식</label>
        <select id="c-format">
          <option value="피드"  ${(d.format||'피드')==='피드'?'selected':''}>피드</option>
          <option value="릴스"  ${d.format==='릴스'?'selected':''}>릴스</option>
          <option value="쓰레드" ${d.format==='쓰레드'?'selected':''}>쓰레드</option>
        </select>
      </div>
    </div>
    <div class="input-row">
      <label id="c-topic-label">${initCat==='콘텐츠'?'주제 / 제목':'내용'}</label>
      <input id="c-topic" placeholder="${initCat==='콘텐츠'?'예: AI 사진관 소개 릴스':'예: 인스타 DM 답장, 굿즈 발주 확인'}" value="${escapeHtml(d.topic||'')}" />
    </div>
    <div class="input-row">
      <label>담당자</label>
      <select id="c-assignee">
        ${MEMBERS.map(m => `<option value="${m.name}" ${d.assignee===m.name?'selected':''}>${m.nick} (${m.name})</option>`).join('')}
      </select>
    </div>
    <div class="input-row">
      <label>상태</label>
      <select id="c-status">
        <option value="planning" ${(d.status||'planning')==='planning'?'selected':''}>기획</option>
        <option value="making"   ${d.status==='making'?'selected':''}>제작중</option>
        <option value="done"     ${d.status==='done'?'selected':''}>완료</option>
        <option value="posted"   ${d.status==='posted'?'selected':''}>업로드완료</option>
      </select>
    </div>
    <div class="input-row">
      <label>메모 (선택)</label>
      <textarea id="c-note" placeholder="추가 메모...">${escapeHtml(d.note||'')}</textarea>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" data-close>취소</button>
      ${isEdit ? `<button class="btn" id="c-del" style="background:var(--danger);color:#fff;margin-right:auto;">삭제</button>` : ''}
      <button class="btn" id="c-save">${isEdit ? '저장' : '추가'}</button>
    </div>
  `);
  let selectedCat = initCat;
  $$('#modal .cat-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      $$('#modal .cat-tab').forEach(x => x.classList.remove('active'));
      btn.classList.add('active');
      selectedCat = btn.dataset.cat;
      $('#c-cont-fields').style.display = selectedCat === '콘텐츠' ? '' : 'none';
      $('#c-topic-label').textContent = selectedCat === '콘텐츠' ? '주제 / 제목' : '내용';
      $('#c-topic').placeholder = selectedCat === '콘텐츠' ? '예: AI 사진관 소개 릴스' : '예: 인스타 DM 답장, 굿즈 발주 확인';
    });
  });
  $('[data-close]').addEventListener('click', closeModal);
  if (isEdit) {
    $('#c-del').addEventListener('click', async () => {
      if (!confirm('삭제할까요?')) return;
      await deleteTeamItem(item.id);
      closeModal(); renderContentSchedule(); toast('삭제됨');
    });
  }
  $('#c-save').addEventListener('click', async () => {
    const topic = $('#c-topic').value.trim();
    if (!topic) { toast('내용을 입력하세요', 'error'); return; }
    const itemData = {
      date: $('#c-date').value,
      category: selectedCat,
      format: selectedCat === '콘텐츠' ? ($('#c-format')?.value || '피드') : null,
      topic, assignee: $('#c-assignee').value,
      status: $('#c-status').value, note: $('#c-note').value.trim()
    };
    $('#c-save').disabled = true;
    if (isEdit) await updateTeamItem(item.id, itemData);
    else await addTeamItem('content', itemData);
    closeModal(); renderContentSchedule();
    toast(isEdit ? '수정됨!' : '추가됨!', 'success');
  });
}

/* ============================================================
 * 회의록
 * ============================================================ */
function renderMinutes() {
  const list = $('#minuteList');
  if (!list) return;
  const minutes = teamItems.filter(x => x.type === 'minute')
    .sort((a, b) => b.data.date.localeCompare(a.data.date));
  if (minutes.length === 0) {
    list.innerHTML = `<div class="empty">📋 아직 회의록이 없어요.<br>첫 회의록을 작성해보세요!</div>`;
    return;
  }
  list.innerHTML = minutes.map(m => {
    const d = m.data;
    const attendeeHtml = (d.attendees || []).map((a, i) => {
      const mi = MEMBERS.findIndex(mb => mb.name === a);
      const label = mi >= 0 ? MEMBERS[mi].nick : a;
      return `<span class="minute-attendee" style="${mi>=0?`color:${['#f5a623','#ff6b6b','#b07cff'][mi]}`:''}"> ${escapeHtml(label)}</span>`;
    }).join('');
    const preview = (d.content || '').replace(/\n/g, ' ').trim();
    return `
      <div class="minute-card" data-id="${m.id}">
        <div class="minute-top">
          <span class="minute-date">${d.date}</span>
          <span class="minute-title">${escapeHtml(d.title)}</span>
        </div>
        ${attendeeHtml ? `<div class="minute-attendees">${attendeeHtml}</div>` : ''}
        ${preview ? `<div class="minute-preview">${escapeHtml(preview)}</div>` : ''}
      </div>`;
  }).join('');
  list.querySelectorAll('.minute-card').forEach(card =>
    card.addEventListener('click', () => {
      const item = teamItems.find(x => x.id === card.dataset.id);
      if (item) openMinuteModal(item);
    })
  );
}

function openMinuteModal(item) {
  const d = item ? item.data : {};
  const isEdit = !!item;
  const today = fmtDate(new Date());
  openModal(`
    <h3>${isEdit ? '📋 회의록 수정' : '📋 회의록 작성'}</h3>
    <div class="input-row">
      <label>날짜</label>
      <input type="date" id="mn-date" value="${d.date || today}" />
    </div>
    <div class="input-row">
      <label>제목</label>
      <input id="mn-title" placeholder="예: 5월 2주차 주간회의" value="${escapeHtml(d.title || '')}" />
    </div>
    <div class="input-row">
      <label>참석자</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;padding:8px 0;">
        ${MEMBERS.map((m, mi) => `
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;">
            <input type="checkbox" value="${m.name}" ${(d.attendees||[]).includes(m.name)?'checked':''} />
            <span style="color:${['#f5a623','#ff6b6b','#b07cff'][mi]}">${m.nick}</span>
          </label>`).join('')}
      </div>
    </div>
    <div class="input-row">
      <label>내용</label>
      <textarea id="mn-content" placeholder="회의 내용, 결정사항, 액션아이템 등..." style="min-height:180px;">${escapeHtml(d.content || '')}</textarea>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" data-close>취소</button>
      ${isEdit ? `<button class="btn" id="mn-del" style="background:var(--danger);color:#fff;margin-right:auto;">삭제</button>` : ''}
      <button class="btn" id="mn-save">${isEdit ? '저장' : '작성'}</button>
    </div>
  `);
  $('[data-close]').addEventListener('click', closeModal);
  if (isEdit) {
    $('#mn-del').addEventListener('click', async () => {
      if (!confirm('삭제할까요?')) return;
      await deleteTeamItem(item.id);
      closeModal(); renderMinutes(); toast('삭제됨');
    });
  }
  $('#mn-save').addEventListener('click', async () => {
    const title = $('#mn-title').value.trim();
    if (!title) { toast('제목을 입력하세요', 'error'); return; }
    const attendees = [...document.querySelectorAll('#modal input[type=checkbox]:checked')].map(c => c.value);
    const itemData = {
      date: $('#mn-date').value,
      title,
      attendees,
      content: $('#mn-content').value.trim()
    };
    $('#mn-save').disabled = true;
    if (isEdit) await updateTeamItem(item.id, itemData);
    else await addTeamItem('minute', itemData);
    closeModal(); renderMinutes();
    toast(isEdit ? '수정됨!' : '회의록 저장됨!', 'success');
  });
}

 * 전체 렌더

function renderAll() {
  renderCategories();
  renderBookmarks();
  renderRecent();
  renderFileGrid();
  updateFileCounts();
  renderContentSchedule();
}
</script>
