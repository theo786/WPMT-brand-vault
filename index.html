<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>" />
<title>WPMT Brand Vault</title>
<style>
  :root {
    --bg: #0d0f14;
    --panel: #161922;
    --panel-2: #1d2230;
    --panel-3: #252b3b;
    --border: #2c3245;
    --text: #ecedf3;
    --muted: #8b93a7;
    --accent: #f5a623;
    --accent-2: #ff6b6b;
    --accent-3: #b07cff;
    --danger: #ff6b8a;
    --success: #6bd98c;
    --warn: #ffb450;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
    font-size: 14px; line-height: 1.5;
  }

  /* === 로그인 === */
  .auth-overlay {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 9999;
  }
  .auth-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px; max-width: 400px; width: 100%;
  }
  .auth-card h2 {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin: 0 0 8px; font-size: 26px;
  }
  .auth-card p { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .auth-card input {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; color: var(--text);
    font-size: 15px; margin-bottom: 10px; font-family: inherit;
  }
  .auth-card input:focus { border-color: var(--accent); outline: none; }
  .auth-btn {
    width: 100%; background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #181014; border: 0; padding: 12px; border-radius: 10px;
    font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .auth-btn.google {
    background: #fff; color: #1f1f1f; margin-bottom: 12px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .auth-divider {
    display: flex; align-items: center; gap: 10px;
    color: var(--muted); font-size: 12px; margin: 12px 0;
  }
  .auth-divider::before, .auth-divider::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }
  .auth-msg { font-size: 13px; padding: 10px; border-radius: 8px; margin-top: 10px; display: none; }
  .auth-msg.err { background: rgba(255,107,138,.1); color: var(--danger); }
  .auth-msg.ok { background: rgba(107,217,140,.1); color: var(--success); }
  .auth-back { background: none; border: 0; color: var(--muted); font-size: 13px; cursor: pointer; padding: 8px; }

  /* === 헤더 === */
  header.topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 22px; border-bottom: 1px solid var(--border);
    background: var(--panel); position: sticky; top: 0; z-index: 50;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-size: 18px; font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .topbar-right { display: flex; align-items: center; gap: 14px; font-size: 13px; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
  .sync-dot.syncing { background: var(--warn); animation: pulse 1s infinite; }
  .sync-dot.error { background: var(--danger); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.3 } }

  .drive-status {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--border);
    cursor: pointer; user-select: none;
  }
  .drive-status:hover { background: var(--panel-3); }
  .drive-status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .drive-status.on .dot { background: var(--success); }

  .user-email { color: var(--muted); }
  .icon-btn {
    background: none; border: 1px solid var(--border); color: var(--text);
    padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  .icon-btn:hover { background: var(--panel-2); }

  /* === 메인 === */
  .container { max-width: 1400px; margin: 0 auto; padding: 22px; }

  /* === 홈 대시보드 === */
  .dashboard {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 14px; margin-bottom: 24px;
  }
  @media (max-width: 1100px) { .dashboard { grid-template-columns: 1fr; } }
  .block {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px; min-height: 180px;
    display: flex; flex-direction: column;
  }
  .block h3 {
    margin: 0 0 10px; font-size: 14px; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  .block .hint { color: var(--muted); font-size: 12px; margin-bottom: 10px; }

  /* URL 입력 블록 */
  .url-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .url-row input {
    flex: 1; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; color: var(--text); font-size: 13px;
    font-family: inherit;
  }
  .url-row input:focus { border-color: var(--accent); outline: none; }
  .url-row select {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; color: var(--text); font-size: 13px;
    font-family: inherit; min-width: 130px;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #181014; border: 0; padding: 10px 18px;
    border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer;
    white-space: nowrap;
  }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .recent-list { font-size: 12px; color: var(--muted); }
  .recent-list .row { padding: 4px 0; display: flex; gap: 6px; align-items: center; }
  .recent-list .row .host { color: var(--accent); }
  .recent-list .row .ttl { color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 드롭존 */
  .drop {
    border: 2px dashed var(--border); border-radius: 12px;
    padding: 28px; text-align: center; cursor: pointer; flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--panel-2); transition: all 0.15s;
  }
  .drop:hover, .drop.over {
    border-color: var(--accent); background: rgba(245,166,35,0.05);
  }
  .drop .ico { font-size: 32px; margin-bottom: 8px; }
  .drop .label { font-size: 13px; font-weight: 600; }
  .drop .sublabel { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .upload-progress { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .upload-progress .item { padding: 4px 0; display: flex; gap: 6px; align-items: center; }

  /* 랜덤 뽑기 */
  .random-tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .random-tabs button {
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); padding: 5px 12px; border-radius: 8px;
    font-size: 12px; cursor: pointer; font-family: inherit;
  }
  .random-tabs button.active {
    background: var(--accent); color: #181014; border-color: var(--accent);
    font-weight: 700;
  }
  .roll-btn {
    background: linear-gradient(135deg, var(--accent-3), var(--accent-2));
    color: #fff; border: 0; padding: 14px;
    border-radius: 10px; font-size: 16px; font-weight: 800; cursor: pointer;
    margin-bottom: 12px; letter-spacing: 0.02em;
  }
  .roll-btn:hover { filter: brightness(1.1); }
  .roll-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .random-result {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 12px;
    background: var(--panel-2); border-radius: 10px; min-height: 60px;
    overflow: hidden; position: relative;
  }
  .random-result img, .random-result video {
    max-width: 100%; max-height: 200px; border-radius: 8px; object-fit: contain;
  }
  .random-result .caption {
    position: absolute; bottom: 6px; left: 8px; right: 8px;
    font-size: 11px; color: var(--text); background: rgba(0,0,0,0.6);
    padding: 4px 8px; border-radius: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* === 탭 (북마크 / 파일) === */
  .tabs {
    display: flex; gap: 4px; margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .tabs button {
    background: none; border: 0; color: var(--muted);
    padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
    border-bottom: 2px solid transparent; font-family: inherit;
  }
  .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs button:hover { color: var(--text); }

  /* === 카테고리 사이드 === */
  .cats-row {
    display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px;
  }
  .cat-chip {
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); padding: 6px 14px; border-radius: 999px;
    font-size: 13px; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; gap: 6px;
  }
  .cat-chip:hover { background: var(--panel-3); }
  .cat-chip.active {
    background: var(--accent); color: #181014; border-color: var(--accent);
    font-weight: 700;
  }
  .cat-chip .n {
    background: rgba(0,0,0,0.2); padding: 2px 6px; border-radius: 8px;
    font-size: 11px; min-width: 18px; text-align: center;
  }
  .cat-chip.active .n { background: rgba(0,0,0,0.25); }

  /* === 카드 그리드 === */
  .grid {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px;
    display: flex; flex-direction: column; gap: 8px;
    transition: border-color 0.12s;
  }
  .card:hover { border-color: var(--accent); }
  .card .name {
    font-weight: 700; font-size: 14px; line-height: 1.3;
    word-break: break-word;
  }
  .card .handle { color: var(--accent); font-size: 12px; }
  .card .url {
    color: var(--muted); font-size: 11px; word-break: break-all;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card .cat-tag {
    display: inline-block; background: var(--panel-2); color: var(--accent);
    padding: 2px 8px; border-radius: 6px; font-size: 11px; align-self: flex-start;
  }
  .card .notes {
    background: var(--panel-2); border-radius: 8px; padding: 8px;
    font-size: 12px; color: var(--muted); min-height: 32px;
    border: 1px solid transparent; cursor: text;
    white-space: pre-wrap; word-break: break-word;
  }
  .card .notes:focus, .card .notes:hover { border-color: var(--border); color: var(--text); outline: none; }
  .card .notes:empty::before { content: '비고사항…'; color: var(--muted); opacity: 0.6; }
  .card .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .card .actions button, .card .actions a {
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); padding: 6px 10px; border-radius: 7px;
    font-size: 11px; cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; gap: 4px; font-family: inherit;
  }
  .card .actions button:hover, .card .actions a:hover { background: var(--panel-3); }
  .card .actions .del { color: var(--danger); }
  .card .actions .ig { color: #e1306c; border-color: rgba(225,48,108,0.3); }
  .card .actions .yt { color: #ff3b3b; border-color: rgba(255,59,59,0.3); }

  .empty {
    text-align: center; padding: 60px 20px;
    color: var(--muted); font-size: 14px;
  }

  /* === 파일 그리드 === */
  .file-grid {
    display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  }
  .file-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; cursor: pointer;
    aspect-ratio: 1; display: flex; flex-direction: column;
    position: relative; transition: border-color 0.12s;
  }
  .file-card:hover { border-color: var(--accent); }
  .file-card .thumb {
    flex: 1; background: var(--panel-2); display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }
  .file-card .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .file-card .thumb .ico { font-size: 36px; }
  .file-card .name {
    padding: 6px 8px; font-size: 11px; line-height: 1.3;
    background: rgba(0,0,0,0.6); position: absolute; bottom: 0; left: 0; right: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .file-card .badge {
    position: absolute; top: 6px; right: 6px;
    background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px;
    font-size: 10px;
  }
  .file-card .video-mark {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: rgba(0,0,0,0.5); border-radius: 50%; width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 18px;
  }

  /* === 모달 === */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: none; align-items: center; justify-content: center; z-index: 100;
    padding: 20px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 22px;
    max-width: 600px; width: 100%; max-height: 90vh; overflow: auto;
  }
  .modal.wide { max-width: 1100px; }
  .modal h3 { margin: 0 0 12px; font-size: 18px; }
  .modal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .modal .preview-media { width: 100%; max-height: 70vh; object-fit: contain; border-radius: 8px; }
  .btn { background: var(--accent); color: #181014; border: 0; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-weight: 700; font-family: inherit; }
  .btn.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); font-weight: 500; }
  .btn:hover { filter: brightness(1.1); }

  /* === Toast === */
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border);
    padding: 10px 18px; border-radius: 8px; font-size: 13px;
    z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }
  .toast.success { border-color: var(--success); color: var(--success); }
  .toast.error { border-color: var(--danger); color: var(--danger); }

  /* 핸들 입력창 */
  .input-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .input-row label { font-size: 12px; color: var(--muted); }
  .input-row input, .input-row textarea, .input-row select {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; color: var(--text);
    font-size: 13px; font-family: inherit;
  }
  .input-row textarea { min-height: 80px; resize: vertical; }
</style>
</head>
<body>

<!-- ========== 로그인 ========== -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <h2>🎨 WPMT Brand Vault</h2>
    <p>윔프매터 브랜드 운영용 보관함</p>

    <div id="authStep1">
      <button class="auth-btn google" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8c1.8-4.4 6-7.5 11.1-7.5 3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3c-2 1.4-4.5 2.3-7.3 2.3-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.6 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.3 5.3c-.4.4 6.6-4.8 6.6-15 0-1.3-.1-2.4-.4-3.5z"/></svg>
        Google로 시작하기
      </button>
      <div class="auth-divider">또는 이메일로</div>
      <input type="email" id="authEmail" placeholder="이메일" autocomplete="email" />
      <button class="auth-btn" id="sendBtn">인증코드 받기</button>
    </div>

    <div id="authStep2" style="display:none">
      <p style="font-size:13px; margin-bottom:12px;">이메일로 받은 6자리 코드를 입력하세요</p>
      <input type="text" id="authCode" placeholder="123456" inputmode="numeric" />
      <button class="auth-btn" id="verifyBtn">로그인</button>
      <button class="auth-back" id="backBtn">← 다시 입력</button>
    </div>

    <div class="auth-msg" id="authMsg"></div>
  </div>
</div>

<!-- ========== 메인 ========== -->
<div id="app" style="display:none">
  <header class="topbar">
    <div class="brand">🎨 WPMT Brand Vault</div>
    <div class="topbar-right">
      <div class="drive-status" id="driveStatus" title="Google Drive 연결">
        <span class="dot"></span><span id="driveLabel">Drive 연결</span>
      </div>
      <span class="sync-dot" id="syncDot"></span>
      <span class="user-email" id="userEmail"></span>
      <button class="icon-btn" id="logoutBtn">로그아웃</button>
    </div>
  </header>

  <div class="container">

    <!-- 홈 대시보드 -->
    <div class="dashboard">
      <!-- 1. URL 추가 -->
      <div class="block">
        <h3>🔗 북마크 추가</h3>
        <div class="hint">URL 붙여넣고 카테고리 선택</div>
        <div class="url-row">
          <input id="urlInput" placeholder="https://..." />
        </div>
        <div class="url-row">
          <select id="categorySelect">
            <option value="이미지 프롬프트">이미지 프롬프트</option>
            <option value="콘텐츠 아이디어">콘텐츠 아이디어</option>
            <option value="관련 서비스">관련 서비스</option>
            <option value="굿즈">굿즈</option>
            <option value="AI ETC">AI ETC</option>
          </select>
          <button class="btn-primary" id="addBtn">추가</button>
        </div>
        <div class="recent-list" id="recentList"></div>
      </div>

      <!-- 2. 드래그앤드롭 -->
      <div class="block">
        <h3>📂 파일 업로드</h3>
        <div class="hint">이미지/영상을 Drive로 업로드</div>
        <div class="drop" id="dropZone">
          <div class="ico">⬆️</div>
          <div class="label">드래그하거나 클릭</div>
          <div class="sublabel">이미지·영상 파일</div>
          <input type="file" id="fileInput" multiple accept="image/*,video/*" style="display:none" />
        </div>
        <div class="upload-progress" id="uploadProgress"></div>
      </div>

      <!-- 3. 랜덤 뽑기 -->
      <div class="block">
        <h3>🎲 랜덤 뽑기</h3>
        <div class="random-tabs">
          <button data-rt="all" class="active">전체</button>
          <button data-rt="image">이미지</button>
          <button data-rt="video">영상</button>
        </div>
        <button class="roll-btn" id="rollBtn">🎲 뽑기</button>
        <div class="random-result" id="randomResult">파일 업로드 후 뽑기 가능</div>
      </div>
    </div>

    <!-- 탭 -->
    <div class="tabs">
      <button data-tab="bookmarks" class="active">북마크</button>
      <button data-tab="files">파일 보관함 <span id="fileCount" style="opacity:0.6">(0)</span></button>
    </div>

    <!-- 북마크 뷰 -->
    <section id="bookmarksView">
      <div class="cats-row" id="catsRow"></div>
      <div class="grid" id="bookmarkGrid"></div>
    </section>

    <!-- 파일 뷰 -->

  }[c]));
}

function normalizeUrl(url) {
  if (!url) return '';
  url = String(url).trim();
  if (!url) return '';
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  return url;
}

function hostOf(url) {
  try { return new URL(url).hostname.toLowerCase().replace(/^www\./, ''); }
  catch { return 'unknown'; }
}

function extractHandle(url) {
  try {
    const u = new URL(url);
    const host = u.hostname.toLowerCase().replace(/^www\./, '');
    const path = u.pathname || '/';
    const SKIP = new Set(['p','reel','reels','stories','explore','tv','accounts','watch','channel','c','user','shorts','playlist','results','feed','home']);
    // /@user, /user, /@user/...
    const m = path.match(/^\/@?([A-Za-z0-9_.\-]+)/);
    if (m && !SKIP.has(m[1].toLowerCase())) {
      return '@' + m[1];
    }
    return null;
  } catch { return null; }
}

function decodeHtmlEntities(s) {
  const t = document.createElement('textarea');
  t.innerHTML = String(s ?? '');

}

function getOembedUrl(url) {
  try {
    const u = new URL(url);
    const host = u.hostname.toLowerCase().replace(/^www\./, '');
    const path = u.pathname || '/';
    const isYt =
      (/(^|\.)youtube\.com$/.test(host) && (u.searchParams.has('v') || /^\/(shorts|embed|live)\//.test(path))) ||
      /^youtu\.be$/.test(host);
    if (isYt) return `https://www.youtube.com/oembed?url=${encodeURIComponent(url)}&format=json`;
    if (/tiktok\./.test(host) && /\/video\/\d+/.test(path)) {
      return `https://www.tiktok.com/oembed?url=${encodeURIComponent(url)}`;
    }
    return null;
  } catch { return null; }
}

function initDriveClient() {
  const cid = getSavedClientId();
  if (!cid || !window.google || !google.accounts || !google.accounts.oauth2) return;
  driveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: cid,
    scope: DRIVE_SCOPE,
    callback: (resp) => {
      if (resp.error) {
        console.warn('Drive auth error:', resp);
        if (resp.error !== 'popup_closed' && resp.error !== 'access_denied') {
          toast('Drive 인증 실패: ' + resp.error, 'error');
        }
        return;
      }
      driveAccessToken = resp.access_token;
      driveTokenExpiresAt = Date.now() + (resp.expires_in - 60) * 1000;
      onDriveConnected();
    },
  });
}

function isDriveConnected() {
  return driveAccessToken && Date.now() < driveTokenExpiresAt;
}

function requestDriveToken(silent) {
  if (!driveTokenClient) {
    if (silent) return;
    promptForClientId();
    return;
  }
  driveTokenClient.requestAccessToken({ prompt: silent ? '' : 'consent' });
}

async function ensureDriveToken() {
  if (isDriveConnected()) return true;
  if (!driveTokenClient) {
    promptForClientId();
    return false;
  }
  return new Promise((resolve) => {
    const orig = driveTokenClient.callback;
    driveTokenClient.callback = (resp) => {
      orig(resp);
      resolve(!!resp.access_token);
    };
    driveTokenClient.requestAccessToken({ prompt: '' });
  });
}

async function driveFetch(url, opts = {}) {
  if (!await ensureDriveToken()) throw new Error('not authenticated');
  const headers = { Authorization: 'Bearer ' + driveAccessToken, ...(opts.headers || {}) };
  const r = await fetch(url, { ...opts, headers });
  if (r.status === 401) {
    driveAccessToken = null;
    if (!await ensureDriveToken()) throw new Error('reauth failed');
    return fetch(url, { ...opts, headers: { Authorization: 'Bearer ' + driveAccessToken, ...(opts.headers || {}) } });
  }
  return r;
}

async function ensureDriveFolder() {
  if (driveFolderId) {
    // 검증 — 폴더가 휴지통에 있거나 사라졌는지
    try {
      const r = await driveFetch(`https://www.googleapis.com/drive/v3/files/${driveFolderId}?fields=id,trashed`);
      if (r.ok) {
        const j = await r.json();
        if (!j.trashed) return driveFolderId;
      }
    } catch {}
    driveFolderId = null;
  }
  // 검색
  const q = encodeURIComponent(`name='${DRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const r = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
  const j = await r.json();
  if (j.files && j.files.length > 0) {
    driveFolderId = j.files[0].id;
  } else {
    // 생성
    const cr = await driveFetch('https://www.googleapis.com/drive/v3/files', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' })
    });
    const cj = await cr.json();
    driveFolderId = cj.id;
  }
  Storage.scheduleSave();
  return driveFolderId;
}

async function uploadFileToDrive(file, onProgress) {
  await ensureDriveToken();
  const folderId = await ensureDriveFolder();
  const meta = { name: file.name, parents: [folderId] };
  const boundary = '-------wpmt' + Math.random().toString(36).slice(2);
  const delim = `\r\n--${boundary}\r\n`;
  const closeDelim = `\r\n--${boundary}--`;

  const head = delim
    + 'Content-Type: application/json; charset=UTF-8\r\n\r\n'
    + JSON.stringify(meta)
    + delim
    + `Content-Type: ${file.type || 'application/octet-stream'}\r\n\r\n`;
  // 더 간단/빠르게: resumable upload 대신 multipart 직접
  // 큰 파일은 resumable 권장이지만 여기선 multipart로 충분
  const bodyParts = [head, file, closeDelim];
  const body = new Blob(bodyParts);

  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,mimeType,thumbnailLink,webViewLink,createdTime');
    xhr.setRequestHeader('Authorization', 'Bearer ' + driveAccessToken);
    xhr.setRequestHeader('Content-Type', `multipart/related; boundary=${boundary}`);
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total);
    };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) resolve(JSON.parse(xhr.responseText));
      else reject(new Error('upload failed: ' + xhr.status + ' ' + xhr.responseText));
    };
    xhr.onerror = () => reject(new Error('upload network error'));
    xhr.send(body);
  });
}

async function listDriveFiles() {
  const folderId = await ensureDriveFolder();
  const fields = 'files(id,name,mimeType,thumbnailLink,webViewLink,webContentLink,createdTime,size)';
  const q = encodeURIComponent(`'${folderId}' in parents and trashed=false`);
  let all = [];
  let pageToken = null;
  do {
    const url = `https://www.googleapis.com/drive/v3/files?q=${q}&fields=${encodeURIComponent(fields + ',nextPageToken')}&pageSize=200&orderBy=createdTime desc${pageToken ? `&pageToken=${pageToken}` : ''}`;
    const r = await driveFetch(url);
    const j = await r.json();
    if (j.files) all.push(...j.files);
    pageToken = j.nextPageToken;
  } while (pageToken);
  driveFiles = all;
  return all;
}

async function deleteDriveFile(fileId) {

}

  if (!r.ok) return null;
  const blob = await r.blob();
  return URL.createObjectURL(blob);
}

    handle: handle || '',
    category: cat,
    notes: '',
    host,
    created_at: Date.now(),
  };
  bookmarks.unshift(item);
  $('#urlInput').value = '';
  Storage.scheduleSave();
  renderBookmarks();
  renderRecent();
  toast('추가됨 — 제목 자동 추출 중…', 'success');

  // oEmbed로 더 좋은 제목 시도 (백그라운드)
  fetchTitleViaOembed(url).then(title => {
    if (title && item.name !== title) {
      // 사용자가 안 건드렸으면 갱신
      const it = bookmarks.find(b => b.id === item.id);
      if (it && (it.name === handle || it.name === host)) {
        it.name = title;
        Storage.scheduleSave();
        renderBookmarks();
      }
    }
  });
}

$('#addBtn').addEventListener('click', addBookmark);
$('#urlInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addBookmark(); } });

/* ============================================================
 * 파일 업로드
 * ============================================================ */
const dropZone = $('#dropZone');
const fileInput = $('#fileInput');

dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => handleFiles(Array.from(fileInput.files)));

['dragenter','dragover'].forEach(ev => {
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add('over'); });
});
['dragleave','drop'].forEach(ev => {
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove('over'); });
});
dropZone.addEventListener('drop', e => {
  if (e.dataTransfer && e.dataTransfer.files) {
    handleFiles(Array.from(e.dataTransfer.files));
  }
});

async function handleFiles(files) {
  if (!files || files.length === 0) return;
  const accepted = files.filter(f => /^image\//.test(f.type) || /^video\//.test(f.type));
  if (accepted.length === 0) { toast('이미지 또는 영상만 업로드 가능해요', 'error'); return; }

  if (!isDriveConnected()) {
    if (!getSavedClientId()) promptForClientId();
    else requestDriveToken(false);
    toast('Drive 연결 후 다시 시도해주세요', 'error');
    return;
  }

  const progEl = $('#uploadProgress');
  progEl.innerHTML = '';
  for (const file of accepted) {
    const row = document.createElement('div');
    row.className = 'item';
    row.innerHTML = `<span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(file.name)}</span><span class="pct">0%</span>`;
    progEl.appendChild(row);
    try {
      const result = await uploadFileToDrive(file, (p) => {
        row.querySelector('.pct').textContent = Math.round(p * 100) + '%';
      });
      row.querySelector('.pct').textContent = '✓';
      // 즉시 캐시에 추가
      driveFiles.unshift({
        id: result.id,
        name: result.name,
        mimeType: result.mimeType,
        thumbnailLink: result.thumbnailLink,
        webViewLink: result.webViewLink,
        createdTime: result.createdTime,
      });
    } catch (e) {
      console.error(e);
      row.querySelector('.pct').textContent = '✗';
      row.style.color = 'var(--danger)';
    }
  }
  toast(`${accepted.length}개 업로드 완료`, 'success');
  setTimeout(() => { progEl.innerHTML = ''; }, 3500);
  renderFileGrid();
  updateFileCounts();
  fileInput.value = '';
}

/* ============================================================
 * 랜덤 뽑기
 * ============================================================ */
$$('.random-tabs button').forEach(b => {
  b.addEventListener('click', () => {
    $$('.random-tabs button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    activeRandomType = b.dataset.rt;
  });
});

$('#rollBtn').addEventListener('click', async () => {
  if (!isDriveConnected()) {
    if (!getSavedClientId()) promptForClientId();
    else requestDriveToken(false);
    toast('Drive 먼저 연결해주세요', 'error');
    return;
  }
  if (driveFiles.length === 0) await refreshDriveFiles();
  let pool = driveFiles;
  if (activeRandomType === 'image') pool = pool.filter(f => /^image\//.test(f.mimeType));
  else if (activeRandomType === 'video') pool = pool.filter(f => /^video\//.test(f.mimeType));
  if (pool.length === 0) { toast('해당 타입 파일이 없어요', 'error'); return; }
  const pick = pool[Math.floor(Math.random() * pool.length)];
  showRandomPick(pick);
});

async function showRandomPick(file) {
  const result = $('#randomResult');
  result.innerHTML = `<div style="font-size:14px;">🎲 뽑는 중…</div>`;
  const isImg = /^image\//.test(file.mimeType);
  const isVid = /^video\//.test(file.mimeType);
  try {
    const url = await fetchDriveMediaUrl(file.id);
    if (!url) throw new Error('media fetch failed');
    if (isImg) {
      result.innerHTML = `<img src="${url}" alt="" /><div class="caption" title="${escapeHtml(file.name)}">${escapeHtml(file.name)}</div>`;
    } else if (isVid) {
      result.innerHTML = `<video src="${url}" controls autoplay muted></video><div class="caption" title="${escapeHtml(file.name)}">${escapeHtml(file.name)}</div>`;
    } else {
      result.innerHTML = `<div>📄 ${escapeHtml(file.name)}</div>`;
    }
    result.style.cursor = 'pointer';
    result.onclick = () => openFilePreview(file);
  } catch (e) {
    console.error(e);
    result.textContent = '뽑기 실패 — 다시 시도';
  }
}

/* ============================================================
 * 렌더 — 카테고리 칩
 * ============================================================ */
function renderCategories() {
  const row = $('#catsRow');
  const total = bookmarks.length;
  let html = `<button class="cat-chip ${activeCategory === 'all' ? 'active' : ''}" data-cat="all">전체 <span class="n">${total}</span></button>`;
  for (const c of CATEGORIES) {
    const n = bookmarks.filter(b => b.category === c).length;
    html += `<button class="cat-chip ${activeCategory === c ? 'active' : ''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)} <span class="n">${n}</span></button>`;
  }
  row.innerHTML = html;
  row.querySelectorAll('.cat-chip').forEach(b => {
    b.addEventListener('click', () => {
      activeCategory = b.dataset.cat;
      renderCategories();
      renderBookmarks();
    });
  });
}

/* ============================================================
 * 렌더 — 북마크 카드
 * ============================================================ */
function renderBookmarks() {
  const grid = $('#bookmarkGrid');
  let list = bookmarks.slice();
  if (activeCategory !== 'all') list = list.filter(b => b.category === activeCategory);
  if (list.length === 0) {
    grid.innerHTML = `<div class="empty">📭 아직 북마크가 없어요</div>`;
    return;
  }
  grid.innerHTML = list.map(renderCard).join('');
  grid.querySelectorAll('.card').forEach(card => bindCardEvents(card));
}

function renderCard(b) {
  const igYt = isInstagramOrThreads(b.url) ? 'ig' : isYoutube(b.url) ? 'yt' : null;
  return `
    <div class="card" data-id="${b.id}">
      <span class="cat-tag">${escapeHtml(b.category)}</span>
      <div class="name" data-field="name" contenteditable="true" spellcheck="false">${escapeHtml(b.name)}</div>
      ${b.handle ? `<div class="handle">${escapeHtml(b.handle)}</div>` : ''}
      <div class="url" title="${escapeHtml(b.url)}">${escapeHtml(b.url)}</div>
      <div class="notes" data-field="notes" contenteditable="true" spellcheck="false">${escapeHtml(b.notes || '')}</div>
      <div class="actions">
        <a href="${escapeHtml(b.url)}" target="_blank" rel="noopener">↗ 열기</a>
        ${igYt === 'ig' ? `<button class="ig" data-act="ig">🎞 IG 다운로드</button>` : ''}
        ${igYt === 'yt' ? `<button class="yt" data-act="yt">🎬 YT 다운로드</button>` : ''}
        <select data-act="movecat" title="카테고리 변경">
          ${CATEGORIES.map(c => `<option value="${escapeHtml(c)}" ${c === b.category ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')}
        </select>
        <button class="del" data-act="del" title="삭제">🗑</button>
      </div>
    </div>
  `;
}

function bindCardEvents(card) {
  const id = card.dataset.id;
  card.querySelectorAll('[contenteditable]').forEach(el => {
    el.addEventListener('blur', () => {
      const it = bookmarks.find(b => b.id === id);
      if (!it) return;
      const field = el.dataset.field;
      const val = el.textContent.trim();
      if (it[field] !== val) {
        it[field] = val;
        Storage.scheduleSave();
      }
    });
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey && el.dataset.field === 'name') {
        e.preventDefault(); el.blur();
      }
    });
  });
  card.querySelector('[data-act="del"]')?.addEventListener('click', () => {
    if (!confirm('삭제할까요?')) return;
    bookmarks = bookmarks.filter(b => b.id !== id);
    Storage.scheduleSave();
    renderAll();
  });
  card.querySelector('[data-act="movecat"]')?.addEventListener('change', (e) => {
    const it = bookmarks.find(b => b.id === id);
    if (!it) return;
    it.category = e.target.value;
    Storage.scheduleSave();
    renderAll();
  });
  card.querySelector('[data-act="ig"]')?.addEventListener('click', () => {
    const it = bookmarks.find(b => b.id === id);
    if (it) openIgDownloader(it.url);
  });
  card.querySelector('[data-act="yt"]')?.addEventListener('click', () => {
    const it = bookmarks.find(b => b.id === id);
    if (it) openYtDownloader(it.url);
  });
}

/* ============================================================
 * 렌더 — 최근 추가
 * ============================================================ */
function renderRecent() {
  const list = bookmarks.slice(0, 3);
  const el = $('#recentList');
  if (list.length === 0) { el.innerHTML = ''; return; }
  el.innerHTML = '<div style="font-size:11px; margin-top:8px; opacity:0.7">최근 추가</div>' + list.map(b => `
    <div class="row"><span class="host">${escapeHtml(hostOf(b.url))}</span><span class="ttl">${escapeHtml(b.name)}</span></div>
  `).join('');
}

/* ============================================================
 * 렌더 — 파일 그리드
 * ============================================================ */
function updateFileCounts() {
  const all = driveFiles.length;
  const img = driveFiles.filter(f => /^image\//.test(f.mimeType)).length;
  const vid = driveFiles.filter(f => /^video\//.test(f.mimeType)).length;
  $('#fct-all').textContent = all;
  $('#fct-image').textContent = img;
  $('#fct-video').textContent = vid;
  $('#fileCount').textContent = `(${all})`;
}

function renderFileGrid() {
  const grid = $('#fileGrid');
  let list = driveFiles.slice();
  if (activeFileFilter === 'image') list = list.filter(f => /^image\//.test(f.mimeType));
  else if (activeFileFilter === 'video') list = list.filter(f => /^video\//.test(f.mimeType));
  if (list.length === 0) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">📭 ${isDriveConnected() ? '파일 없음' : 'Drive 먼저 연결'}</div>`;
    return;
  }
  grid.innerHTML = list.map(renderFileCard).join('');
  grid.querySelectorAll('.file-card').forEach(card => {
    const id = card.dataset.id;
    const f = driveFiles.find(x => x.id === id);
    if (!f) return;
    card.addEventListener('click', () => openFilePreview(f));
  });
  // 썸네일 인증 토큰으로 로딩
  list.forEach(f => {
    if (!f.thumbnailLink) return;
    const img = grid.querySelector(`.file-card[data-id="${f.id}"] .thumb img`);
    if (!img) return;
    fetch(f.thumbnailLink, { headers: { Authorization: 'Bearer ' + driveAccessToken } })
      .then(r => r.ok ? r.blob() : null)
      .then(blob => { if (blob) img.src = URL.createObjectURL(blob); })
      .catch(() => {});
  });
}

function renderFileCard(f) {
  const isImg = /^image\//.test(f.mimeType);
  const isVid = /^video\//.test(f.mimeType);
  const ico = isImg ? '🖼' : isVid ? '🎬' : '📄';
  return `
    <div class="file-card" data-id="${f.id}">
      <div class="thumb">
        ${f.thumbnailLink ? '<img alt="" />' : `<div class="ico">${ico}</div>`}
        ${isVid ? '<div class="video-mark">▶</div>' : ''}
      </div>
      <div class="badge">${isImg ? 'IMG' : isVid ? 'VID' : 'FILE'}</div>
      <div class="name" title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</div>
    </div>
  `;
}

async function openFilePreview(f) {
  openWideModal(`
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <div style="font-weight:700; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(f.name)}</div>
      <div style="display:flex; gap:6px;">
        <a class="btn ghost" href="${escapeHtml(f.webViewLink)}" target="_blank" rel="noopener">Drive에서 열기 ↗</a>
        <button class="btn ghost" id="dlBtn">⬇ 다운로드</button>
        <button class="btn ghost" id="delBtn" style="color:var(--danger)">🗑 삭제</button>
        <button class="btn ghost" data-close>닫기 ×</button>
      </div>
    </div>
    <div id="previewSlot" style="text-align:center; min-height:200px;">불러오는 중…</div>
  `);
  $('[data-close]').addEventListener('click', closeModal);
  $('#delBtn').addEventListener('click', async () => {
    if (!confirm('Drive에서 삭제할까요? (휴지통으로 이동)')) return;
    try {
      await deleteDriveFile(f.id);
      toast('삭제됨', 'success');
      closeModal();
      renderFileGrid();
      updateFileCounts();
    } catch (e) {
      toast('삭제 실패', 'error');
    }
  });
  $('#dlBtn').addEventListener('click', async () => {
    const url = await fetchDriveMediaUrl(f.id);
    if (!url) { toast('다운로드 실패', 'error'); return; }
    const a = document.createElement('a');
    a.href = url; a.download = f.name; a.click();
  });

  try {
    const url = await fetchDriveMediaUrl(f.id);
    if (!url) throw new Error('media fetch failed');
    const slot = $('#previewSlot');
    if (!slot) return;
    if (/^image\//.test(f.mimeType)) {
      slot.innerHTML = `<img class="preview-media" src="${url}" />`;
    } else if (/^video\//.test(f.mimeType)) {
      slot.innerHTML = `<video class="preview-media" src="${url}" controls autoplay></video>`;
    } else {
      slot.innerHTML = `<div>이 파일 형식은 미리보기 미지원 — Drive에서 열어보세요</div>`;
    }
  } catch (e) {
    const slot = $('#previewSlot');
    if (slot) slot.textContent = '미리보기 로딩 실패';
  }
}

/* ============================================================
 * 탭 전환
 * ============================================================ */
$$('.tabs button').forEach(b => {
  b.addEventListener('click', () => {
    $$('.tabs button').forEach(x => x.classList.remove('active'));

      refreshDriveFiles();
    }
  });
});

document.addEventListener('click', (e) => {
  const ftBtn = e.target.closest('[data-ft]');
  if (ftBtn) {
    document.querySelectorAll('[data-ft]').forEach(x => x.classList.remove('active'));
    ftBtn.classList.add('active');
    activeFileFilter = ftBtn.dataset.ft;
    renderFileGrid();
  }
});

/* ============================================================
 * IG/YT 다운로더 연동
 * ============================================================ */
async function checkServerRunning(baseUrl) {
  try {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 1500);
    await fetch(baseUrl + '/api/ping', { mode: 'no-cors', signal: ctrl.signal })
      .catch(async () => {
        await fetch(baseUrl + '/api/auth/status', { mode: 'no-cors', signal: ctrl.signal });
      });
    clearTimeout(to);
    return true;
  } catch { return false; }
}

function extractIgUsername(url) {
  try {
    const u = new URL(url);
    const m = u.pathname.match(/^\/@?([A-Za-z0-9_.]+)/);
    if (!m) return null;
    const f = m[1];
    if (['p','reel','reels','stories','explore','tv','accounts'].includes(f)) return null;
    return f;
  } catch { return null; }
}

  const running = await checkServerRunning(IG_DOWNLOADER_URL);
  if (!running) {
    openModal(`
      <h3>🎞 인스타 다운로더 서버 꺼짐</h3>
      <p style="color:var(--muted);">서버를 먼저 켜주세요.</p>
      <ol style="font-size:13px; line-height:1.9; color:var(--muted);">
        <li>Finder에서 <code>/Users/taeholee/클로드코드/instagram-downloader/</code> 열기</li>
        <li><b>▶ 처음 1번 - 자동시작 설정.command</b> 우클릭 → Terminal로 열기</li>
        <li>이 페이지 새로고침</li>
      </ol>
      <div class="modal-actions">
        <button class="btn" data-close>확인</button>

  openWideModal(`
    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">

  $('#igNew').addEventListener('click', () => window.open(target, '_blank'));
  $('[data-close]').addEventListener('click', closeModal);
}

/* ============================================================

function renderAll() {
